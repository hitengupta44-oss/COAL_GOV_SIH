# Scheduled governance jobs.
#
# Alerts, reminders and escalation only work if something runs them. This
# workflow is that something: no server to keep alive, and every run's log
# is kept by GitHub.
#
#   hourly  alerts_engine.py      overdue actions, alerts, escalation, email
#           publish_audit_anchor  verifies the audit hash chain, records its
#                                 head hash in the job summary, and once a day
#                                 anchors it in Bitcoin (OpenTimestamps)
#   daily   risk_scoring_job.py   backward-looking risk flags
#           predictive_job.py     forward-looking predictions + early warnings
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY     required
#   GROQ_API_KEY                                optional (plain-English flag explanations)
#   SMTP_HOST, SMTP_PORT, SMTP_USER,
#   SMTP_PASSWORD, ALERT_EMAIL_FROM             optional (email notifications)
#   ALERT_EMAIL_REDIRECT                        optional: send every alert email to this
#                                               one inbox (for demos: the demo accounts'
#                                               addresses are not real)
#
# Run any job by hand from the Actions tab ("Run workflow").

name: Governance jobs

on:
  schedule:
    - cron: "5 * * * *"      # hourly, at :05
    - cron: "30 0 * * *"     # daily, 06:00 IST
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        type: choice
        options: [alerts, analytics, all]
        default: all

concurrency:
  group: governance-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: supabase
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
      ALERT_EMAIL_REDIRECT: ${{ secrets.ALERT_EMAIL_REDIRECT }}
      DAILY: ${{ github.event.schedule == '30 0 * * *' || inputs.job == 'analytics' || inputs.job == 'all' }}
      HOURLY: ${{ github.event.schedule == '5 * * * *' || inputs.job == 'alerts' || inputs.job == 'all' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: supabase/requirements.txt
      - run: pip install -r requirements.txt

      - name: Risk scoring
        if: env.DAILY == 'true'
        run: python risk_scoring_job.py
      - name: Predictive compliance
        if: env.DAILY == 'true'
        run: python predictive_job.py

      # Alerts run after analytics so the day's new flags and early warnings
      # are picked up in the same pass.
      - name: Alerts, reminders, escalation
        if: env.HOURLY == 'true' || env.DAILY == 'true'
        run: python alerts_engine.py
      - name: Verify and anchor the audit trail
        if: always()
        run: python publish_audit_anchor.py
